name: OpenWrt SDK x86 package
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Full rebuild includes prerequisites; leaf checks only the package recipe/payload'
        type: choice
        options: [full, leaf]
        default: full
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sh scripts/test-sdk.sh '${{ inputs.scope }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-24.10.8-x86-${{ inputs.scope }}-not-hardware-certified
          path: .local/sdk-24.10.8-${{ inputs.scope }}/
